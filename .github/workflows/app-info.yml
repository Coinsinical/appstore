name: Update Apps Info

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'apps/*/data.yml'
      - 'apps/*/*/docker-compose.yml'

jobs:
  update-apps-info:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
          
      - name: Configure repo
        run: |
          git config --local user.email "githubaction@githubaction.com"
          git config --local user.name "github-action update-app-info"

      - name: Generate App List Table
        id: generate_table
        run: |
          chmod +x .github/workflows/app-info.sh
          {
            echo "table_content<<EOF"
            .github/workflows/app-info.sh apps
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Inject Table into README.md
        env:
          TABLE: ${{ steps.generate_table.outputs.table_content }}
        run: |
          README="README.md"
          tmp="${README}.tmp"
          awk -v tbl="$TABLE" '
            /<!--[ ]*apps:table:start[ ]*-->/ { print; print tbl; skip=1; next }
            /<!--[ ]*apps:table:end[ ]*-->/ { skip=0 }
            !skip
          ' "$README" > "$tmp" && mv "$tmp" "$README"

      - name: Commit changes
        run: |
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update apps info [skip ci]"
          git push
