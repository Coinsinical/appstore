name: Backup Docker images
on:
  push:
    branches:
      - dev
    paths:
      - 'apps/*/*/docker-compose.yml'

env:
  REGISTRY: ghcr.io

jobs:
  backup-docker-images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in Github Container Repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN }}

      - name: Process Images
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'apps/*/*/docker-compose.yml' | while read -r file; do
            [ ! -f "$file" ] && continue

            version=$(echo "$file" | cut -d'/' -f 3)
            
            yq eval '.services[].image' "$file" | sort -u | while read -r src; do
              [[ -z "$src" || "$src" == "null" ]] && continue

              source_repo_name="${src%:*}"

              if [[ "$src" != *":"* ]] || [[ "$src" == *":latest" ]]; then
                target_tag="$version"
              else
                target_tag="${src##*:}"
              fi
              
              target="${{ env.REGISTRY }}/$owner/$source_repo_name:$target_tag"
              
              docker pull "$src"
              docker tag "$src" "$target"
              docker push "$target"
            done
          done


