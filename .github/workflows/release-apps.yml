name: Release Apps

on:
  push:
    paths:
      - 'apps/**'
    branches:
      - dev

permissions:
  contents: write

jobs:
  release-apps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Release Date Tag
        run: echo "TAG_NAME=$(TZ='Asia/Shanghai' date +'%Y.%m.%d')" >> $GITHUB_ENV

      - name: Generate App List Table
        id: app_table
        run: |
          chmod +x .github/workflows/app-info.sh
          {
            echo "table_content<<EOF"
            .github/workflows/app-info.sh apps
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Package Apps Directory
        run: zip -r apps.zip apps/

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUBTOKEN }}
          TAG: ${{ env.TAG_NAME }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          APP_TABLE: ${{ steps.app_table.outputs.table_content }}
        run: |
          echo "Target Tag: $TAG"

          section_apps="### 📦 应用列表 (App List)"
          section_logs="### 📝 更新日志 (Update Log)"

          commit_subject="$(printf '%s' "$COMMIT_MSG" | head -n1)"
          new_log_entry="- $commit_subject"

          body_file="$(mktemp)"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists. Merging content..."

            old_body="$(gh release view "$TAG" --json body -q .body 2>/dev/null || true)"
            [ "$old_body" = "null" ] && old_body=""

            old_logs_content="$(printf '%s\n' "$old_body" | awk -v s="$section_logs" '
              BEGIN{found=0}
              \$0==s{found=1; next}
              found && /^### /{exit}
              found{print}
            ')"
            {
              printf "%s\n\n" "$section_apps"
              printf "%s\n\n" "$APP_TABLE"
              printf "%s\n\n" "$section_logs"
              if [ -n "$old_logs_content" ]; then
                printf "%s\n" "$old_logs_content"
              fi
              printf "%s\n" "$new_log_entry"
            } > "$body_file"

            gh release edit "$TAG" --notes-file "$body_file"
            gh release upload "$TAG" apps.zip --clobber

          else
            echo "Release $TAG does not exist. Creating new..."

            {
              printf "%s\n\n" "$section_apps"
              printf "%s\n\n" "$APP_TABLE"
              printf "%s\n\n" "$section_logs"
              printf "%s\n" "$new_log_entry"
            } > "$body_file"

            gh release create "$TAG" apps.zip --title "Release $TAG" --notes-file "$body_file"
          fi
