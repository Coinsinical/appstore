services:
  termix:
    image: ghcr.io/lukegus/termix:release-1.11.2
    container_name: ${CONTAINER_NAME}
    restart: always
    ports:
      - ${PANEL_APP_PORT_HTTP}:8080     
    volumes:
      - ./data:/app/data
    environment:
      PORT: "8080"
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true